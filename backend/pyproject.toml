[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hetu"
version = "0.1.0"
requires-python = ">=3.13"
description = "河图智弈 - 企业级 AI 智能体测试平台"
authors = [{ name = "jinglv" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    # web服务相关
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.3",
    # 数据库
    "tortoise-orm[asyncpg]>=1.1.8",
    "psycopg-binary>=3.3.4",
    # 日志
    "loguru>=0.7.3",
    # langchain / agent
    "deepagents>=0.7.6",
    "langchain-openai>=1.5.0",
    "bcrypt>=5.0.0",
    "python-jose>=3.5.0",
    "captcha>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hetu"]

[tool.tortoise]
tortoise_orm = "src.hetu.config.TORTOISE_ORM"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
